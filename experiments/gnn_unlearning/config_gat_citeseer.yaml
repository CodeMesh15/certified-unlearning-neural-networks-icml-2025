# GNN Certified Unlearning Configuration - GAT on Citeseer

experiment_name: "gat_citeseer_certified_unlearning"
seed: 42
save_every: 10

model:
  name: "gat"
  n_classes: 6
  hidden_dims: [64, 32]
  num_heads: [8, 1]
  dropout_rate: 0.6
  attention_dropout: 0.6

dataset:
  name: "citeseer"
  data_dir: "./data"
  batch_size: 1
  forget_ratio: 0.15
  input_shape: [3312, 3703]
  normalize_adj: false  # GAT doesn't need normalized adjacency

training:
  epochs: 200
  optim: "Adam"
  max_lr: 0.005
  lr_schedule: "constant"
  weight_decay: 5.0e-4

unlearning:
  algorithm: "contractive_coefficients"
  epochs: 100
  optim: "Adam"
  max_lr: 0.01
  lr_schedule: "constant"
  weight_decay: 5.0e-4
  init_model_clip: 15.0
  init_sigma: 1.0
  delta: 1.0e-5
  
  contractive_coefficients:
    epsilon_target: 1.0
    sigma: 0.2
    model_clip: 8.0
    grad_clip: 0.2
    noise_addition_after_projection: false
    noise_addition_before_projection: true

post_unlearning:
  epochs: 50
  optim: "Adam"
  max_lr: 0.003
  lr_schedule: "constant"
  weight_decay: 5.0e-4
  post_unlearn_clip: 15.0

adaptive_privacy:
  enabled: true
  mechanism: "grad_norm_adaptive"
  clip_norm: 0.2
  smoothing: 0.9

checkpoint_path: "./checkpoints/gat_citeseer"
use_pretrained: false
